apiVersion: v1
kind: Service
metadata:
  name: redis-broker
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-broker
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
---
apiVersion: v1
kind: Service
metadata:
  name: flask-api
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: flask-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask
          image: rce-backend:latest
          imagePullPolicy: Never
          command: ["python", "api.py"]
          env:
            - name: REDIS_URL
              value: "redis://redis-broker:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        # --- NEW: Docker-in-Docker Sidecar ---
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" 
          volumeMounts:
            - name: shared-tmp
              mountPath: /tmp

        # --- UPDATED: Your Python Worker ---
        - name: celery
          image: rce-backend:latest
          imagePullPolicy: Never
          command: ["celery", "-A", "tasks", "worker", "--pool=solo", "--loglevel=info"]
          env:
            - name: REDIS_URL
              value: "redis://redis-broker:6379/0"
            - name: DOCKER_HOST
              value: "tcp://localhost:2375" 
          volumeMounts:
            - name: shared-tmp
              mountPath: /tmp
      
      volumes:
        - name: shared-tmp
          emptyDir: {}